# Access-log format with timing, loaded into the http block of every nginx config
# (installed as conf.d/00-timing.conf by the Dockerfile, so it sorts before default.conf).
#
#   rt   = $request_time          seconds from the first byte received to the last byte sent
#                                  (includes the client's download speed)
#   urt  = $upstream_response_time seconds the backend took to answer ("-" for static files)
#
# If rt is large and urt is small, the time went on the way to or from the browser (network,
# slow device); if urt is large, the backend was slow. Everyone in the OPSC office shares one
# public address, so tell people apart by time and user-agent, not by IP.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time '
                 '"$http_user_agent" xff="$http_x_forwarded_for"';
