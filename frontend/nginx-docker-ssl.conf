# Production Nginx — HTTP (ACME challenge + redirect) + HTTPS (direct LAN access).
# Requires certificates in /etc/letsencrypt/live/${DOMAIN}/ from Certbot.
# Set DOMAIN in .env and replace ${DOMAIN} at deploy time, or use envsubst.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/app-locations.conf;
}

server {
    # default_server: catch-all for direct-by-IP hits with no/unmatched SNI.
    listen 443 ssl http2 default_server;
    server_name scdms.psc.gov.vu;

    # Mounted separately from /etc/letsencrypt: issued via a self-owned
    # certbot config-dir (DNS-01 against the govt-managed psc.gov.vu zone),
    # not the host's root-owned certbot config used by the retired
    # scdms.ipdu.work domain.
    ssl_certificate     /etc/letsencrypt-psc/live/scdms.psc.gov.vu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-psc/live/scdms.psc.gov.vu/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/app-locations.conf;
}
