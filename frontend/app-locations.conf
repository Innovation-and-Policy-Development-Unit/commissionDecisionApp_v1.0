# Shared app-serving locations — included by both the plain-HTTP server block
# (only reached here once it's confirmed the request already arrived over TLS
# upstream, e.g. via the Cloudflare Tunnel, which terminates public TLS at its
# edge and forwards X-Forwarded-Proto: https) and the local HTTPS block.

# Compress responses over the wire — covers the static JS/CSS bundle here
# AND everything proxied through /api (gzip_proxied any is required for the
# latter; text/html is gzipped by nginx by default and doesn't need listing).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    font/woff2
    image/svg+xml;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

error_page 404 /index.html;

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location ~* \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Service worker + its manifest use fixed (non-hashed) filenames specifically
# so browsers can poll them for updates — they must never be long-cached, or
# a deploy can go unnoticed for up to a year (the generic static-asset rule
# below would otherwise catch sw.js too, since it also ends in .js).
location = /sw.js {
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /api {
    # Re-resolve `backend` via Docker's embedded DNS on every request
    # instead of caching the IP for the life of the worker process —
    # otherwise a backend container restart/rebuild (new IP) leaves
    # nginx proxying to a dead address until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 20m;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
}

# Quarto-rendered HTML guides — embedded same-origin in the SPA via <iframe>.
# Relax the global X-Frame-Options: DENY to same-origin so the iframe loads.
location ^~ /guides/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600";
}

location ^~ /media/ {
    alias /var/scdms/media/;
    add_header Cache-Control "private, max-age=3600";
}

location ~ /\. {
    deny all;
    return 404;
}
