# Production overlay: TLS via Let's Encrypt (Certbot, DNS-01/Cloudflare) + Nginx on `web`.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Certificates are issued/renewed on the HOST via `certbot` + the
# certbot-dns-cloudflare plugin (not the container webroot method — this
# server is LAN-only and can't satisfy an HTTP-01 challenge from the public
# internet). Host's /etc/letsencrypt is bind-mounted read-only into `web`.
# See docs/deployment-tls.md.

services:
  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - scdms_media:/var/scdms/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/scdms/.certbot-tmp/config:/etc/letsencrypt-psc:ro
      - ./frontend/nginx-docker-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/app-locations.conf:/etc/nginx/app-locations.conf:ro

  # Cloudflare Tunnel — outbound-only connector, no inbound firewall/port-forward
  # needed. Token-based (remotely-managed): public hostname → origin service
  # routing is configured in the Cloudflare Zero Trust dashboard (Networks >
  # Tunnels > this tunnel > Public Hostname), not here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_started
        required: true
    networks:
      - app
    restart: unless-stopped
