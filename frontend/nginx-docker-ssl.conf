# Production Nginx — HTTP (ACME challenge + Cloudflare Tunnel origin) + HTTPS (direct LAN access).
# Requires certificates in /etc/letsencrypt/live/${DOMAIN}/ from Certbot.
# Set DOMAIN in .env and replace ${DOMAIN} at deploy time, or use envsubst.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A direct plain-HTTP hit (LAN client, no upstream TLS) still gets bounced
    # to HTTPS. Traffic arriving via the Cloudflare Tunnel already terminated
    # TLS at Cloudflare's edge and forwards X-Forwarded-Proto: https — that
    # traffic is served here directly instead of being redirected, which would
    # otherwise loop (tunnel's origin is plain HTTP by design; redirecting it
    # back to https://scdms.ipdu.work only sends it straight back through the
    # tunnel to this same port).
    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/app-locations.conf;
}

server {
    # default_server: keeps prior catch-all behavior (e.g. direct-by-IP hits
    # with no/unmatched SNI) falling back to the legacy domain's cert.
    listen 443 ssl http2 default_server;
    server_name scdms.ipdu.work;

    ssl_certificate     /etc/letsencrypt/live/scdms.ipdu.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scdms.ipdu.work/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/app-locations.conf;
}

server {
    listen 443 ssl http2;
    server_name scdms.psc.gov.vu;

    # Mounted separately from /etc/letsencrypt: issued via a self-owned
    # certbot config-dir (DNS-01 against the govt-managed psc.gov.vu zone),
    # not the host's root-owned /etc/letsencrypt used for scdms.ipdu.work.
    ssl_certificate     /etc/letsencrypt-psc/live/scdms.psc.gov.vu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-psc/live/scdms.psc.gov.vu/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/app-locations.conf;
}
