# Preserve HTTPS when TLS terminates at Caddy (or another edge proxy).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compress responses over the wire — covers the static JS/CSS bundle here
    # AND everything proxied through /api (gzip_proxied any is required for
    # the latter; text/html is gzipped by nginx by default, no need to list).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        font/woff2
        image/svg+xml;

    # ── NCSS 2030 Security Headers ────────────────────────────────────────────
    # HTTP Strict Transport Security (enable once TLS is live)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Deny framing from other origins (clickjacking protection)
    add_header X-Frame-Options "DENY" always;

    # Enable XSS filter in legacy browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control referrer information leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict browser features not needed by SCDMS
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy — tightened for SPA + API-only external calls
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Do not cache error pages
    error_page 404 /index.html;

    # SPA: never cache the shell so new JS/CSS hashes are picked up after deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # Repeat security headers inside location blocks (nginx scoping)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # ES module workers (.mjs) — must come before the generic JS/CSS block
    # nginx's built-in mime.types doesn't include .mjs, so it defaults to
    # application/octet-stream which browsers reject for module scripts.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Immutable static assets (hashed filenames) — API responses are not cached here
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API proxy to Django backend
    location /api {
        # Re-resolve `backend` via Docker's embedded DNS on every request
        # instead of caching the IP for the life of the worker process —
        # otherwise a backend container restart/rebuild (new IP) leaves
        # nginx proxying to a dead address until nginx itself is restarted.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # Use $http_host (includes port) so Django builds correct absolute URLs
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Allow document uploads up to 50 MB — real government reports (scanned
        # Corporate Plans etc.) routinely exceed 20MB; 21MB was rejected by a
        # real MoCCA Corporate Plan during testing.
        client_max_body_size 50m;

        # Hide backend version info
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Quarto-rendered HTML guides — embedded same-origin in the SPA via <iframe>.
    # The global X-Frame-Options: DENY / frame-ancestors 'none' would block the
    # iframe ("refused to connect"), so relax framing to same-origin here only.
    location ^~ /guides/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Submission documents carry the same RBAC scoping as the rest of the
    # submission API (ministry/unit/assignment restrictions enforced at the
    # Django queryset level) — serving them directly from the static alias
    # below bypasses all of that. The app never links to this path directly;
    # every document view/download goes through the authenticated
    # /api/submissions/{id}/documents/{doc_id}/ endpoint. More specific than
    # the general /media/ location, so it wins nginx's longest-prefix match.
    location ^~ /media/submission_documents/ {
        deny all;
        return 403;
    }

    # Media files served directly from the shared volume (no Django overhead)
    # ^~ prevents the static-asset regex from intercepting /media/*.png etc.
    location ^~ /media/ {
        alias /var/scdms/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=3600";
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }
}
